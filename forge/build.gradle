plugins {
    id 'net.neoforged.moddev.legacyforge'
}

base {
    archivesName = 'emi-structures'
}

// emi-structures-0.1.1+1.20.1-forge.jar
tasks.named('jar', Jar).configure {
    archiveClassifier = loader
    manifest {
        attributes 'MixinConfigs': 'emi_structures.mixins.json'
    }
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE_emi_structures' }
    }
}

tasks.withType(ProcessResources).configureEach {
    def replacements = [
            minecraft_version    : minecraft_version,
            forge_version_range  : forge_version_range,
            loader_version_range : loader_version_range,
            emi_version          : emi_version,
            mod_version          : project.version
    ]
    inputs.properties replacements
    filesMatching('META-INF/mods.toml') { expand replacements }
}

sourceSets.main.resources.srcDir(project(':common').file('src/main/resources'))

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly(project(':common'))
    commonJava project(path: ':common', configuration: 'commonJava')

    modCompileOnly "dev.emi:emi-forge:${emi_version}:api"
    modRuntimeOnly "dev.emi:emi-forge:${emi_version}"
}

mixin {
    add sourceSets.main, 'emi_structures.refmap.json'
    config 'emi_structures.mixins.json'
}

tasks.named('compileJava', JavaCompile).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar).configure {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
}

legacyForge {
    version = forge_version
    runs {
        client {
            client()
            gameDirectory = project.layout.projectDirectory.dir('run/client')
        }
        server {
            server()
            gameDirectory = project.layout.projectDirectory.dir('run/server')
            programArgument '--nogui'
        }
    }
    mods {
        emi_structures {
            sourceSet sourceSets.main
        }
    }
}
