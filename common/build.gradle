plugins {
    id 'net.neoforged.moddev.legacyforge'
}

base {
    archivesName = 'emi-structures-common'
}

legacyForge {
    // Vanilla Minecraft classes without loader APIs for shared sources.
    mcpVersion = minecraft_version
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}:api"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
