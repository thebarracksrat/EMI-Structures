org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true

# Mod coordinates
# mod_version: semver channel for this release line
# minecraft_version: game target; combined as published version mod_version+minecraft_version
# loader: Forge jar suffix only (not a separate semver channel).
# The Fabric jar suffix is set in fabric/build.gradle.
mod_id=emi_structures
mod_version=0.1.1
minecraft_version=1.20.1
loader=forge

# Forge
forge_version=1.20.1-47.4.23
forge_version_range=[47,)
loader_version_range=[47,)

# Fabric
fabric_version=0.92.12+1.20.1
fabric_loader_version=0.16.14

# EMI
emi_version=1.1.24+1.20.1
