org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true

# Mod coordinates
# mod_version: semver channel for this release line
# minecraft_version: game target; combined as published version mod_version+minecraft_version
# loader: NeoForge jar suffix only (not a separate semver channel).
# The Fabric jar suffix is set in fabric/build.gradle.
mod_id=emi_structures
mod_version=0.1.1
minecraft_version=1.21.1
loader=neoforge

# Common (NeoForm vanilla-mode compile target for shared sources)
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430

# NeoForge
neoforge_version=21.1.234
neoforge_version_range=[21.1,)
loader_version_range=[4,)

# Fabric
fabric_version=0.116.17+1.21.1
fabric_loader_version=0.16.14

# EMI
emi_version=1.1.24+1.21.1
